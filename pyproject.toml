[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-traffic-togo"
version = "0.1.0"
description = "Système de régulation adaptative des feux de circulation pour Lomé (Togo)"
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["_legacy", ".venv", ".git"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Isolation de app.core"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.main"]
